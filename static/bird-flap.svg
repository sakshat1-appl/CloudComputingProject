<svg xmlns="http://www.w3.org/2000/svg" width="48" height="36" viewBox="0 0 48 36">
  <!-- body -->
  <ellipse cx="22" cy="19" rx="17" ry="13" fill="#FFEB3B" stroke="#333" stroke-width="2"/>
  <!-- belly -->
  <ellipse cx="22" cy="24" rx="10" ry="6" fill="#FFF9C4"/>
  <!-- wing (up frame) -->
  <ellipse cx="18" cy="13" rx="9" ry="5.5" fill="#FF9800" stroke="#333" stroke-width="1.5" transform="rotate(25 18 13)"/>
  <!-- eye -->
  <circle cx="33" cy="12" r="6.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="35" cy="13" r="3" fill="#222"/>
  <circle cx="36" cy="12" r="1" fill="#fff"/>
  <!-- beak -->
  <polygon points="38,17 46,20 38,23" fill="#FF5722" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- tail -->
  <polygon points="5,16 1,19 5,22" fill="#FF9800" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
