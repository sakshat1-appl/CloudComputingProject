<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird - Cloud Edition</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <h1>Flappy Bird - Cloud Edition</h1>
  <div class="row">
    <div>
      <div class="controls">
        <input id="player" maxlength="20" placeholder="Your name (e.g. ABC)" value="Player1">
        <button id="startBtn">Start / Restart</button>
        <span>Space / Click to flap</span>
      </div>
      <canvas id="game" width="400" height="550"></canvas>
      <p id="msg">Press Start, then Space or Click.</p>
    </div>
    <div class="side">
      <h2>Cloud Leaderboard (Top 10)</h2>
      <ol id="board"><li>Loading...</li></ol>
      <h2>Cloud Stats (MapReduce)</h2>
      <pre id="stats">Loading...</pre>
    </div>
  </div>
</div>
<script src="/static/game.js"></script>
</body>
</html>
